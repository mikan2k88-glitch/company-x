<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カンパニーX | Gateway X-OS AIダッシュボード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        let pnlChartInstance = null;

        function initChart() {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            pnlChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['初期化中...'],
                    datasets: [
                        {
                            label: '売上 ($ USD)',
                            data: [0],
                            borderColor: '#22c55e',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.35
                        },
                        {
                            label: '純利益 ($ USD)',
                            data: [0],
                            borderColor: '#3b82f6',
                            borderWidth: 2,
                            borderDash: [4, 4],
                            fill: false,
                            tension: 0.35
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#9ca3af', font: { family: 'Inter', size: 11 } }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#6b7280', font: { family: 'Inter', size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#6b7280', font: { family: 'Inter', size: 11 } }
                        }
                    }
                }
            });
        }

        async function fetchRealDashboardData() {
            try {
                // 1. Fetch Real KPI Stats
                const statsRes = await fetch('/api/stats');
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('kpiRevenue').innerText = `$${(stats.total_revenue_usd || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                    document.getElementById('kpiProfit').innerText = `$${(stats.total_profit_usd || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                    document.getElementById('kpiMargin').innerText = `${((stats.avg_margin || 0.83) * 100).toFixed(1)}%`;
                    document.getElementById('kpiTasks').innerText = `${stats.total_tasks || 0} 件`;
                }

                // 2. Fetch Real Logs from DB
                const logsRes = await fetch('/api/logs');
                if (logsRes.ok) {
                    const logs = await logsRes.json();
                    renderLogsTable(logs);
                    updateChartWithLogs(logs);
                }
            } catch (err) {
                console.warn("DBデータ取得エラー (フォールバック使用):", err);
            }
        }

        function renderLogsTable(records) {
            const tbody = document.getElementById('debateLogsTable');
            tbody.innerHTML = '';

            if (!records || records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">DBにまだ記録がありません。自律ループを実行してください。</td></tr>';
                return;
            }

            records.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800/40 transition duration-150';

                const createdTime = r.created_at ? r.created_at.substring(0, 16) : '直近';
                const taskName = r.intent || '案件スカウト';
                const cost = r.cost_jpy || 0;
                const revenue = r.price_usd || 0;
                const statusStr = r.status || 'SUCCESS';

                let statusBadge = '<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-0.5 rounded text-[10px]">合意・完了</span>';
                if (statusStr.includes('CIRCUIT')) {
                    statusBadge = '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded text-[10px]">サーキットブレーカー</span>';
                }

                let ceoBadge = cost >= 50000 
                    ? '<span class="text-blue-400 font-semibold"><i class="fa-brands fa-line mr-1"></i>LINE承認要</span>'
                    : '<span class="text-gray-400">自動承認 (<5万円)</span>';

                tr.innerHTML = `
                    <td class="p-3 text-gray-400">${createdTime}</td>
                    <td class="p-3 text-white font-medium">${taskName}</td>
                    <td class="p-3 text-gray-300">¥${cost.toLocaleString()}</td>
                    <td class="p-3 text-emerald-400 font-bold">$${revenue.toFixed(2)}</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3">${ceoBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateChartWithLogs(records) {
            if (!pnlChartInstance || !records || records.length === 0) return;

            const sorted = [...records].reverse();
            const labels = sorted.map(r => r.created_at ? r.created_at.substring(5, 10) : '件');
            const revenues = sorted.map(r => r.price_usd || 0);
            const profits = sorted.map(r => (r.price_usd || 0) * 0.83);

            pnlChartInstance.data.labels = labels;
            pnlChartInstance.data.datasets[0].data = revenues;
            pnlChartInstance.data.datasets[1].data = profits;
            pnlChartInstance.update();
        }

        async function triggerAutonomousLoop() {
            const btn = document.getElementById('runLoopBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>実行中...</span>';

            showToast("自律成長ループ起動", "Qiitaからリアルタイムトレンドを取得し、Gemini ✕ DeepSeek-R1 ディベートを実行中...");

            try {
                const res = await fetch('/api/run-loop', { method: 'POST' });
                if (res.ok) {
                    setTimeout(async () => {
                        await fetchRealDashboardData();
                        showToast("自律ループ完了 🎉", "SQLite DBへ最新のP&Lと取引結果を記録しました！");
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }, 4000);
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Initialize on page load and fetch real data
        window.onload = function() {
            initChart();
            fetchRealDashboardData();
        };
    </script>
</body>
</html>
