<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company X - Dual Engine Autonomous Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    .title { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .status-badge { padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: bold; background: #065f46; color: #34d399; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .kpi-card.internal { border-left: 4px solid #10b981; }
    .kpi-card.gateway { border-left: 4px solid #3b82f6; }
    .kpi-card.total { border-left: 4px solid #f59e0b; }
    .kpi-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
    .kpi-value { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .kpi-sub { font-size: 12px; color: #64748b; }
    .refresh-btn { background: #0284c7; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .refresh-btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">⚡ COMPANY X | 二輪駆動 リアルタイム P&L Dashboard</div>
    <div>
      <span id="sys-status" class="status-badge">HEALTHY (v3.2)</span>
      <button class="refresh-btn" onclick="fetchStats()">更新</button>
    </div>
  </div>

  <!-- KPI 分離カード -->
  <div class="kpi-grid">
    <!-- 1. 内部デジタル処理 (99%) -->
    <div class="kpi-card internal">
      <div class="kpi-title">💻 内部デジタルタスク (粗利 99.0%)</div>
      <div class="kpi-value" style="color: #10b981;" id="internal-revenue">¥0</div>
      <div class="kpi-sub">
        純利益: <strong id="internal-profit" style="color: #f8fafc;">¥0</strong> | 完了: <span id="internal-count">0</span> 件
      </div>
    </div>

    <!-- 2. Gateway X 現場発注 (83%) -->
    <div class="kpi-card gateway">
      <div class="kpi-title">🚚 Gateway X 現場発注 (粗利 83.0%)</div>
      <div class="kpi-value" style="color: #3b82f6;" id="gateway-revenue">¥0</div>
      <div class="kpi-sub">
        純利益: <strong id="gateway-profit" style="color: #f8fafc;">¥0</strong> | 完了: <span id="gateway-count">0</span> 件
      </div>
    </div>

    <!-- 3. 合計収益 -->
    <div class="kpi-card total">
      <div class="kpi-title">📈 総合受発注実績 (Total P&L)</div>
      <div class="kpi-value" style="color: #f59e0b;" id="total-revenue">¥0</div>
      <div class="kpi-sub">
        総純利益: <strong id="total-profit" style="color: #f8fafc;">¥0</strong> | 累計件数: <span id="total-count">0</span> 件
      </div>
    </div>
  </div>

  <script>
    async function fetchStats() {
      try {
        const res = await fetch('/api/v1/dashboard/stats');
        const json = await res.json();
        
        if (json.status === 'SUCCESS') {
          const d = json.data;
          
          // 内部デジタル
          document.getElementById('internal-revenue').innerText = '¥' + d.internal.revenue.toLocaleString();
          document.getElementById('internal-profit').innerText = '¥' + d.internal.profit.toLocaleString();
          document.getElementById('internal-count').innerText = d.internal.count;
          
          // Gateway X
          document.getElementById('gateway-revenue').innerText = '¥' + d.gateway.revenue.toLocaleString();
          document.getElementById('gateway-profit').innerText = '¥' + d.gateway.profit.toLocaleString();
          document.getElementById('gateway-count').innerText = d.gateway.count;
          
          // 合計
          document.getElementById('total-revenue').innerText = '¥' + d.total.revenue.toLocaleString();
          document.getElementById('total-profit').innerText = '¥' + d.total.profit.toLocaleString();
          document.getElementById('total-count').innerText = d.total.count;
        }
      } catch (e) {
        console.error('Stats取得エラー:', e);
      }
    }

    // 初回ロード ＆ 10秒ごとの自動更新
    fetchStats();
    setInterval(fetchStats, 10000);
  </script>
</body>
</html>
